# Dependabot configuration for Python backend repositories
# Standard: petry-projects/.github/standards/dependabot-policy.md
version: 2
updates:
  # pip — security updates only (limit 0 suppresses version updates)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "security"
      - "dependencies"

  # GitHub Actions — version updates (keep actions current)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "security"
      - "dependencies"
