sonar.projectKey=petry-projects_empower-personal-dashboard
sonar.organization=petry-projects
sonar.sources=empower_personal_dashboard
sonar.tests=tests
sonar.exclusions=**/node_modules/**,**/vendor/**,**/dist/**,**/build/**,**/__pycache__/**,**/*.egg-info/**,data/**,output/**
# Block the analysis on the quality gate result so the required `SonarCloud`
# check fails when the gate fails (the scanner does not wait by default, which
# would leave the job green on a later gate failure). Applies to both scan attempts.
sonar.qualitygate.wait=true
# Coverage report produced by the SonarCloud workflow (coverage xml) so the scan
# reports real Python coverage instead of 0% on new code.
sonar.python.coverage.reportPaths=coverage.xml
# False-positive suppression: pythonsecurity:S2083 (path traversal) in
# beancount.py. The flagged write in BeancountGenerator._append_single_file
# re-writes a ledger whose path is already validated by _prepare_ledger_path
# (NUL-byte rejection + leaf-and-parent symlink refusal + resolve()) before any
# write occurs. The taint engine mislabels the ledger's own existing content
# (read back to inject the FIFO booking option) as an unsanitized path source;
# the write target is never derived from untrusted content. export_single_file
# is reached only from the CLI with a user-chosen output path — the MCP server
# confines its exports via export_modular_ledger under export_root — so there is
# no untrusted path actor to constrain against a base directory.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.e1.resourceKey=empower_personal_dashboard/beancount.py
