sonar.projectKey=petry-projects_empower-personal-dashboard
sonar.organization=petry-projects
sonar.sources=empower_personal_dashboard
sonar.tests=tests
sonar.exclusions=**/node_modules/**,**/vendor/**,**/dist/**,**/build/**,**/__pycache__/**,**/*.egg-info/**,data/**,output/**
# Block the analysis on the quality gate result so the required `SonarCloud`
# check fails when the gate fails (the scanner does not wait by default, which
# would leave the job green on a later gate failure). Applies to both scan attempts.
sonar.qualitygate.wait=true
# Coverage report produced by the SonarCloud workflow (coverage xml) so the scan
# reports real Python coverage instead of 0% on new code.
sonar.python.coverage.reportPaths=coverage.xml
# Supported interpreters (pyproject.toml: requires-python >= 3.9). Without this
# the analyzer assumes the newest Python and raises rules that only apply from
# 3.10 on — e.g. python:S6546 (PEP 604 `X | Y` hints), whose suggested change
# raises TypeError at import time on 3.9.
sonar.python.version=3.9, 3.10, 3.11, 3.12, 3.13
# False-positive suppression: pythonsecurity:S2083 (path traversal) in
# BeancountGenerator._append_single_file. The single confirmed false positive —
# the ledger re-write whose path is already validated by _prepare_ledger_path
# (NUL-byte rejection + leaf-and-parent symlink refusal + resolve()) before any
# write occurs — is now suppressed with a narrow inline ``# NOSONAR`` comment at
# that exact line, rather than a file-wide exclusion. A file-wide resourceKey
# exclusion would hide every future S2083 finding across beancount.py's other
# write_text sinks and keep the quality gate silently green; the inline comment
# scopes the suppression to the one line the taint engine mislabels.
