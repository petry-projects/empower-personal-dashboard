openapi: 3.1.0
info:
  title: Empower Personal Dashboard API
  description: |-
    Reverse-engineered OpenAPI 3.1 interface specification for Empower Personal Dashboard (formerly Personal Capital).
    Models the upstream RPC-over-HTTP wire protocol and canonical financial domain models for linked bank, credit, loan, and investment accounts.

    All data models and examples adhere strictly to the project's Zero-PII mandate using synthetic test benchmarks.
  version: 0.3.0
  contact:
    name: Empower Personal Dashboard Contributors
    url: https://github.com/petry-projects/empower-personal-dashboard
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://home.personalcapital.com/api
    description: Default legacy web API endpoint
  - url: https://pc-api.empower-retirement.com/api
    description: Unified platform migrated API endpoint (auto-routed on Code 920)

security:
  - CookieAuth: []
    CsrfToken: []

paths:
  /login/identifyUser:
    post:
      summary: Identify user and initiate authentication
      description: |-
        Submits the user's login identifier (email/username). Returns initial session state,
        available two-factor challenge methods, or indicates migration to the unified retirement platform.
      operationId: identifyUser
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IdentifyUserRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifyUserRequest'
      responses:
        '200':
          description: Identification result and challenge requirements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifyUserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /credential/challengeSms:
    post:
      summary: Request 2FA challenge via SMS
      description: Triggers an out-of-band SMS verification code sent to the user's linked telephone number.
      operationId: challengeSms
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChallengeSmsRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeSmsRequest'
      responses:
        '200':
          description: Challenge dispatched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /credential/challengeEmail:
    post:
      summary: Request 2FA challenge via Email
      description: Triggers an out-of-band email verification code sent to the user's registered email address.
      operationId: challengeEmail
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChallengeEmailRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeEmailRequest'
      responses:
        '200':
          description: Challenge dispatched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /credential/authenticateSms:
    post:
      summary: Submit SMS 2FA verification code
      description: Submits the one-time SMS verification code to establish trusted device authentication.
      operationId: authenticateSms
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthenticateCodeRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticateCodeRequest'
      responses:
        '200':
          description: Verification code accepted; device authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /credential/authenticateEmailByCode:
    post:
      summary: Submit Email 2FA verification code
      description: Submits the one-time email verification code to establish trusted device authentication.
      operationId: authenticateEmailByCode
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthenticateCodeRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticateCodeRequest'
      responses:
        '200':
          description: Verification code accepted; device authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /credential/authenticatePassword:
    post:
      summary: Authenticate password and bind device
      description: |-
        Submits password credential and device metadata. On success, binds the device
        and issues persistent session cookies.
      operationId: authenticatePassword
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthenticatePasswordRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticatePasswordRequest'
      responses:
        '200':
          description: Authentication successful; session established.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /newaccount/getAccounts:
    post:
      summary: Fetch aggregated accounts and balance figures
      description: |-
        Primary accounts aggregation endpoint. Returns linked financial institution accounts,
        current balances, asset/liability classifications, and net worth totals.
      operationId: getAccounts
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DataQueryRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/DataQueryRequest'
      responses:
        '200':
          description: Aggregated accounts and balance totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /newaccount/getAccounts2:
    post:
      summary: Fetch aggregated accounts and balance figures (v2)
      description: Extended accounts aggregation endpoint with additional institution metadata.
      operationId: getAccounts2
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DataQueryRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/DataQueryRequest'
      responses:
        '200':
          description: Aggregated accounts and balance totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /invest/getHoldings:
    post:
      summary: Fetch investment portfolio holdings and lots
      description: Returns individual investment positions, security identifiers (ticker, CUSIP), quantities, prices, and daily performance metrics.
      operationId: getHoldings
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DataQueryRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/DataQueryRequest'
      responses:
        '200':
          description: Investment positions and total portfolio value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetHoldingsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /transaction/getUserTransactions:
    post:
      summary: Fetch paginated and filtered historical transactions
      description: Retrieves transaction records within a date range, optionally filtered by user account IDs.
      operationId: getUserTransactions
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetTransactionsRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/GetTransactionsRequest'
      responses:
        '200':
          description: Historical transactions and cashflow totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserTransactionsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /transaction/getUserTransactions2:
    post:
      summary: Fetch paginated and filtered historical transactions (v2)
      description: Extended transactions endpoint with enhanced categorization metadata.
      operationId: getUserTransactions2
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetTransactionsRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/GetTransactionsRequest'
      responses:
        '200':
          description: Historical transactions and cashflow totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserTransactionsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /account/getHistories:
    post:
      summary: Fetch daily portfolio history and account balance trajectory
      description: Retrieves daily snapshots of total assets, total liabilities, net worth, and individual account balances across a specified date range.
      operationId: getHistories
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetHistoriesRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/GetHistoriesRequest'
      responses:
        '200':
          description: Daily balance histories and net worth trajectory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetHistoriesEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Session cookie issued upon successful password authentication.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF
      description: Cross-site request forgery prevention token extracted from web session or spHeader.

  responses:
    BadRequestError:
      description: Bad request, missing parameters, or invalid payload structure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RpcEnvelope'
    UnauthorizedError:
      description: Unauthorized, session expired, or authentication required (Empower Code 202/203).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RpcEnvelope'

  schemas:
    # --------------------------------------------------------------------------
    # Tier 1: Upstream Wire Protocol Envelopes & Payloads
    # --------------------------------------------------------------------------

    SpHeader:
      type: object
      description: Empower RPC response header envelope containing status, CSRF updates, and error lists.
      required:
        - success
      properties:
        success:
          type: boolean
          description: Indicates whether the RPC call completed without fatal failure.
          example: true
        authLevel:
          type: string
          description: Current session authentication level.
          enum:
            - NONE
            - USER_IDENTIFIED
            - MFA_REQUIRED
            - USER_REMEMBERED
          example: USER_REMEMBERED
        csrf:
          type: string
          description: Rotated or active CSRF token for subsequent requests.
          example: csrf-token-synthetic-abc123
        status:
          type: string
          description: Human-readable status indicator.
          example: OK
        code:
          type:
            - integer
            - 'null'
          description: Upstream status code (0 for success).
          example: 0
        errors:
          type: array
          description: List of error objects if the request failed or required redirection.
          items:
            $ref: '#/components/schemas/ApiError'

    ApiError:
      type: object
      description: Standard upstream error structure.
      properties:
        code:
          type: integer
          description: Empower domain error code (e.g. 202/203 session expired, 920 platform migration).
          example: 920
        message:
          type: string
          description: Upstream error message or migration description.
          example: User has migrated to the new site.

    RpcEnvelope:
      type: object
      description: Generic RPC response envelope.
      required:
        - spHeader
      properties:
        spHeader:
          $ref: '#/components/schemas/SpHeader'
        spData:
          type: object
          description: Endpoint-specific payload dictionary.

    IdentifyUserRequest:
      type: object
      required:
        - username
        - csrf
      properties:
        username:
          type: string
          description: User login email or username.
          example: user@example.com
        csrf:
          type: string
          description: Scraped homepage CSRF token.
          example: initial-csrf-token
        apiClient:
          type: string
          default: WEB
          example: WEB
        bindDevice:
          type: string
          default: "false"
          example: "false"
        skipLinkAccount:
          type: string
          default: "false"
        redirectTo:
          type: string
          default: ""
        skipFirstUse:
          type: string
          default: ""
        referrerId:
          type: string
          default: ""

    IdentifyUserData:
      type: object
      description: User identification data payload.
      properties:
        allCredentials:
          type: array
          items:
            $ref: '#/components/schemas/CredentialChallengeMethod'
        challengeMethods:
          type: array
          items:
            $ref: '#/components/schemas/CredentialChallengeMethod'

    IdentifyUserEnvelope:
      type: object
      required:
        - spHeader
      properties:
        spHeader:
          $ref: '#/components/schemas/SpHeader'
        spData:
          $ref: '#/components/schemas/IdentifyUserData'

    CredentialChallengeMethod:
      type: object
      description: 2FA challenge channel supported by user account.
      properties:
        name:
          type: string
          description: Credential identifier (e.g., OOB_SMS, OOB_EMAIL).
          example: OOB_SMS
        status:
          type: string
          description: Credential activation state.
          example: ACTIVE
        display:
          type: string
          description: Masked phone number or email destination.
          example: (***) ***-1234

    ChallengeSmsRequest:
      type: object
      required:
        - csrf
      properties:
        challengeReason:
          type: string
          default: DEVICE_AUTH
          example: DEVICE_AUTH
        challengeMethod:
          type: string
          default: OP
          example: OP
        challengeType:
          type: string
          default: challengeSMS
          example: challengeSMS
        apiClient:
          type: string
          default: WEB
          example: WEB
        bindDevice:
          type: string
          default: "false"
          example: "false"
        csrf:
          type: string
          description: Active session CSRF token.
          example: csrf-token-synthetic-abc123

    ChallengeEmailRequest:
      type: object
      required:
        - csrf
      properties:
        challengeReason:
          type: string
          default: DEVICE_AUTH
          example: DEVICE_AUTH
        challengeMethod:
          type: string
          default: OP
          example: OP
        challengeType:
          type: string
          default: challengeEmail
          example: challengeEmail
        apiClient:
          type: string
          default: WEB
          example: WEB
        bindDevice:
          type: string
          default: "false"
          example: "false"
        csrf:
          type: string
          description: Active session CSRF token.
          example: csrf-token-synthetic-abc123

    AuthenticateCodeRequest:
      type: object
      required:
        - code
        - csrf
      properties:
        challengeReason:
          type: string
          default: DEVICE_AUTH
          example: DEVICE_AUTH
        challengeMethod:
          type: string
          default: OP
          example: OP
        code:
          type: string
          description: One-time verification code received via SMS or email.
          example: "123456"
        apiClient:
          type: string
          default: WEB
          example: WEB
        bindDevice:
          type: string
          default: "false"
          example: "false"
        csrf:
          type: string
          description: Active session CSRF token.
          example: csrf-token-synthetic-abc123

    AuthenticatePasswordRequest:
      type: object
      required:
        - passwd
        - csrf
      properties:
        passwd:
          type: string
          format: password
          description: Account password.
          example: "***REDACTED***"
        deviceName:
          type: string
          default: Empower CLI Client
          example: Empower CLI Client
        bindDevice:
          type: string
          default: "true"
          example: "true"
        apiClient:
          type: string
          default: WEB
          example: WEB
        csrf:
          type: string
          description: Active session CSRF token.
          example: csrf-token-synthetic-abc123
        redirectTo:
          type: string
          default: ""
        skipFirstUse:
          type: string
          default: ""
        skipLinkAccount:
          type: string
          default: "false"
        referrerId:
          type: string
          default: ""

    DataQueryRequest:
      type: object
      required:
        - csrf
      properties:
        lastServerChangeId:
          type: string
          default: "-1"
          example: "-1"
        apiClient:
          type: string
          default: WEB
          example: WEB
        csrf:
          type: string
          description: Active session CSRF token.
          example: csrf-token-synthetic-abc123

    GetTransactionsRequest:
      type: object
      required:
        - csrf
      properties:
        startDate:
          type: string
          format: date
          description: Filter transactions on or after this ISO date.
          example: "2026-09-01"
        endDate:
          type: string
          format: date
          description: Filter transactions on or before this ISO date.
          example: "2026-09-30"
        userAccountIds:
          type: array
          items:
            type:
              - integer
              - string
          description: Optional list of user account IDs to filter.
          example: [1001, 1002]
        lastServerChangeId:
          type: string
          default: "-1"
          example: "-1"
        apiClient:
          type: string
          default: WEB
          example: WEB
        csrf:
          type: string
          description: Active session CSRF token.
          example: csrf-token-synthetic-abc123

    GetHistoriesRequest:
      type: object
      required:
        - csrf
      properties:
        startDate:
          type: string
          format: date
          description: Start date of historical query range (YYYY-MM-DD).
          example: "2026-09-01"
        endDate:
          type: string
          format: date
          description: End date of historical query range (YYYY-MM-DD).
          example: "2026-09-30"
        userAccountIds:
          type: array
          items:
            type:
              - integer
              - string
          description: Optional list of user account IDs to filter.
          example: [1001, 1002]
        apiClient:
          type: string
          default: WEB
          example: WEB
        csrf:
          type: string
          description: Active session CSRF token.
          example: csrf-token-synthetic-abc123

    UpstreamAccount:
      type: object
      description: Raw financial institution account object from getAccounts RPC.
      properties:
        accountId:
          type:
            - string
            - integer
          description: Unique institution-assigned or system account identifier.
          example: ACC-INV-001
        userAccountId:
          type:
            - integer
            - 'null'
          description: Internal numerical user account ID.
          example: 1001
        name:
          type: string
          description: Account name provided by institution or user.
          example: Horizon 401(k) Retirement Plan
        accountName:
          type: string
          description: Alternative account label.
          example: Horizon 401(k) Retirement Plan
        firmName:
          type: string
          description: Financial institution or brokerage firm name.
          example: Horizon Investments
        accountType:
          type: string
          description: Account classification category.
          example: INVESTMENT
        currentBalance:
          type: number
          format: double
          description: Current account balance.
          example: 350000.00
        balance:
          type: number
          format: double
          description: Alternative balance field.
          example: 350000.00
        isAsset:
          type: boolean
          description: True if asset (bank, investment), false if liability (credit card, mortgage, loan).
          example: true
        currency:
          type: string
          default: USD
          example: USD
        lastRefreshed:
          type:
            - string
            - 'null'
          format: date-time
          description: ISO timestamp of last upstream institution synchronization.
          example: "2026-10-01T08:00:00Z"

    AccountsData:
      type: object
      description: Data payload returned by getAccounts RPC.
      properties:
        networth:
          type: number
          format: double
          description: Aggregated total net worth.
          example: 547050.00
        netWorth:
          type: number
          format: double
          example: 547050.00
        totalCash:
          type: number
          format: double
          example: 79500.00
        cashAccountsTotal:
          type: number
          format: double
          example: 79500.00
        totalInvestment:
          type: number
          format: double
          example: 475000.00
        investmentAccountsTotal:
          type: number
          format: double
          example: 475000.00
        totalCreditCard:
          type: number
          format: double
          example: 2450.00
        creditCardAccountsTotal:
          type: number
          format: double
          example: 2450.00
        totalLoan:
          type: number
          format: double
          example: 0.00
        loanAccountsTotal:
          type: number
          format: double
          example: 0.00
        totalMortgage:
          type: number
          format: double
          example: 0.00
        mortgageAccountsTotal:
          type: number
          format: double
          example: 0.00
        totalOtherAssets:
          type: number
          format: double
          example: 0.00
        otherAssetAccountsTotal:
          type: number
          format: double
          example: 0.00
        totalOtherLiabilities:
          type: number
          format: double
          example: 0.00
        otherLiabilitiesAccountsTotal:
          type: number
          format: double
          example: 0.00
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/UpstreamAccount'

    GetAccountsEnvelope:
      type: object
      required:
        - spHeader
      properties:
        spHeader:
          $ref: '#/components/schemas/SpHeader'
        spData:
          $ref: '#/components/schemas/AccountsData'

    UpstreamHolding:
      type: object
      description: Raw investment holding record from getHoldings RPC.
      properties:
        userAccountId:
          type:
            - integer
            - 'null'
          example: 1001
        accountName:
          type: string
          example: Horizon 401(k) Retirement Plan
        ticker:
          type: string
          example: VTI
        originalTicker:
          type: string
          example: VTI
        cusip:
          type: string
          example: "922908769"
        originalCusip:
          type: string
          example: "922908769"
        description:
          type: string
          example: Vanguard Total Stock Market ETF
        originalDescription:
          type: string
          example: Vanguard Total Stock Market ETF
        holdingType:
          type: string
          example: ETF
        type:
          type: string
          example: ETF
        quantity:
          type: number
          format: double
          example: 1000.0
        price:
          type: number
          format: double
          example: 275.50
        value:
          type: number
          format: double
          example: 275500.00
        costBasis:
          type:
            - number
            - 'null'
          format: double
          example: 200000.00
        holdingPercentage:
          type:
            - number
            - 'null'
          format: double
          example: 58.0
        oneDayPercentChange:
          type:
            - number
            - 'null'
          format: double
          example: 0.45
        oneDayValueChange:
          type:
            - number
            - 'null'
          format: double
          example: 1239.75

    HoldingsData:
      type: object
      description: Data payload returned by getHoldings RPC.
      properties:
        holdingsTotalValue:
          type: number
          format: double
          description: Aggregate valuation across all investment positions.
          example: 475000.00
        holdings:
          type: array
          items:
            $ref: '#/components/schemas/UpstreamHolding'

    GetHoldingsEnvelope:
      type: object
      required:
        - spHeader
      properties:
        spHeader:
          $ref: '#/components/schemas/SpHeader'
        spData:
          $ref: '#/components/schemas/HoldingsData'

    UpstreamTransaction:
      type: object
      description: Raw transaction entry from getUserTransactions RPC.
      properties:
        userTransactionId:
          type:
            - string
            - integer
          example: TXN-001
        accountId:
          type:
            - string
            - integer
          example: ACC-CHK-003
        userAccountId:
          type:
            - integer
            - 'null'
          example: 1003
        accountName:
          type: string
          example: Apex Premier Checking
        transactionDate:
          type: string
          format: date
          example: "2026-09-15"
        description:
          type: string
          example: Payroll Direct Deposit
        originalDescription:
          type: string
          example: ACH DIRECT DEPOSIT PAYROLL
        amount:
          type: number
          format: double
