          format: double
          example: 5375.50
        moneyOut:
          type: number
          format: double
          example: 182.40
        netCashflow:
          type: number
          format: double
          example: 5193.10
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/UpstreamTransaction'

    GetUserTransactionsEnvelope:
      type: object
      required:
        - spHeader
      properties:
        spHeader:
          $ref: '#/components/schemas/SpHeader'
        spData:
          $ref: '#/components/schemas/TransactionsData'

    DailyHistoryEntryWire:
      type: object
      description: Raw daily history snapshot from getHistories RPC.
      properties:
        date:
          type: string
          format: date
          example: "2026-09-01"
        totalAssets:
          type: number
          format: double
          example: 549500.00
        totalLiabilities:
          type: number
          format: double
          example: 2450.00
        netWorth:
          type: number
          format: double
          example: 547050.00
        balances:
          type: object
          description: >-
            Map of account ID to balance on that date. Upstream responses may
            also carry sibling keys suffixed `Annotation` whose values are
            textual notes rather than numbers; these are modelled separately via
            patternProperties and ignored by the client normalizer.
          patternProperties:
            "Annotation$":
              type: string
              description: Optional textual annotation for an account balance entry.
          additionalProperties:
            type: number
            format: double
          example:
            "1001": 350000.00
            "1002": 120000.00
            "1003": 75000.00
            "1004": 4500.00
            "1005": 2450.00

    HistoriesData:
      type: object
      description: Data payload returned by getHistories RPC.
      properties:
        startDate:
          type: string
          format: date
          description: Start date of the historical query range returned (YYYY-MM-DD).
          example: "2026-09-01"
        endDate:
          type: string
          format: date
          description: End date of the historical query range returned (YYYY-MM-DD).
          example: "2026-09-30"
        histories:
          type: array
          items:
            $ref: '#/components/schemas/DailyHistoryEntryWire'

    GetHistoriesEnvelope:
      type: object
      required:
        - spHeader
      properties:
        spHeader:
          $ref: '#/components/schemas/SpHeader'
        spData:
          $ref: '#/components/schemas/HistoriesData'

    # --------------------------------------------------------------------------
    # Tier 2: Canonical Domain Schemas (CLI, Python Models, & FastMCP)
    # --------------------------------------------------------------------------

    AccountBalance:
      type: object
      description: Cleaned and normalized financial institution account balance.
      required:
        - account_id
        - account_name
        - firm_name
        - account_type
        - balance
        - is_asset
        - currency
      properties:
        account_id:
          type: string
          description: Normalized string identifier for the account.
          example: ACC-INV-001
        account_name:
          type: string
          description: Sanitized account title without mojibake or replacement characters.
          example: Horizon 401(k) Retirement Plan
        firm_name:
          type: string
          description: Sanitized institution or brokerage firm name.
          example: Horizon Investments
        account_type:
          type: string
          description: Normalized account type (INVESTMENT, BANK, CREDIT_CARD, MORTGAGE, LOAN, OTHER).
          example: INVESTMENT
        balance:
          type: number
          format: double
          description: Account balance rounded to two decimal places.
          example: 350000.00
        is_asset:
          type: boolean
          description: Indicates whether this account contributes positively to assets (true) or liabilities (false).
          example: true
        currency:
          type: string
          default: USD
          example: USD
        last_refreshed:
          type:
            - string
            - 'null'
          description: ISO timestamp when account was last refreshed from institution.
          example: "2026-10-01T08:00:00Z"
        user_account_id:
          type:
            - integer
            - 'null'
          description: Internal numerical account identifier.
          example: 1001

    DashboardBalances:
      type: object
      description: Canonical aggregated balance sheet and net worth statement.
      required:
        - as_of_date
        - net_worth
        - total_cash
        - total_investment
        - total_credit_card
        - total_loan
        - total_mortgage
        - accounts
        - accounts_count
        - mode
      properties:
        as_of_date:
          type: string
          format: date
          description: Valuation date (YYYY-MM-DD).
          example: "2026-10-01"
        net_worth:
          type: number
          format: double
          description: Total net worth (Assets minus Liabilities).
          example: 547050.00
        total_cash:
          type: number
          format: double
          description: Total liquid cash across checking and savings.
          example: 79500.00
        total_investment:
          type: number
          format: double
          description: Total investments across brokerages and retirement accounts.
          example: 475000.00
        total_credit_card:
          type: number
          format: double
          description: Total credit card liabilities.
          example: 2450.00
        total_loan:
          type: number
          format: double
          description: Total outstanding personal/auto loan balances.
          example: 0.00
        total_mortgage:
          type: number
          format: double
          description: Total mortgage liabilities.
          example: 0.00
        total_other_assets:
          type: number
          format: double
          default: 0.00
          example: 0.00
        total_other_liabilities:
          type: number
          format: double
          default: 0.00
          example: 0.00
        accounts_count:
          type: integer
          description: Number of linked accounts included.
          example: 5
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountBalance'
        mode:
          type: string
          description: Operating mode (live or sandbox_mock).
          enum:
            - live
            - sandbox_mock
          example: live

    InvestmentHolding:
      type: object
      description: Sanitized investment position within an investment/brokerage account.
      required:
        - account_name
        - ticker
        - cusip
        - description
        - holding_type
        - quantity
        - price
        - value
      properties:
        user_account_id:
          type:
            - integer
            - 'null'
          example: 1001
        account_name:
          type: string
          example: Horizon 401(k) Retirement Plan
        ticker:
          type: string
          description: Stock or ETF ticker symbol.
          example: VTI
        cusip:
          type: string
          description: Security CUSIP identifier.
          example: "922908769"
        description:
          type: string
          description: Sanitized security name or company description.
          example: Vanguard Total Stock Market ETF
        holding_type:
          type: string
          description: Instrument classification (ETF, Stock, Mutual Fund, Bond, Cash, Other).
          example: ETF
        quantity:
          type: number
          format: double
          description: Number of shares or units held.
          example: 1000.0
        price:
          type: number
          format: double
          description: Current unit market price.
          example: 275.50
        value:
          type: number
          format: double
          description: Total position market value (quantity * price).
          example: 275500.00
        cost_basis:
          type:
            - number
            - 'null'
          format: double
          description: Total acquisition cost.
          example: 200000.00
        holding_percentage:
          type:
            - number
            - 'null'
          format: double
          description: Percentage of overall investment portfolio.
          example: 58.00
        one_day_percent_change:
          type:
            - number
            - 'null'
          format: double
          description: One-day percentage change.
          example: 0.45
        one_day_value_change:
          type:
            - number
            - 'null'
          format: double
          description: One-day dollar gain or loss.
          example: 1239.75

    DashboardHoldings:
      type: object
      description: Canonical investment portfolio summary with itemized positions.
      required:
        - as_of_date
        - total_value
        - holdings_count
